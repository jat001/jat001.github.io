name: Deploy static content to Alibaba Cloud OSS

on:
  push:
    branches:
      - master
    paths:
      - '**'
      - '!.github/**'
      - '!.vscode/**'
      - '!scaffolds/**'
      - '!source/_drafts/**'
      - '!worker/**'
      - '!.gitignore'
      - '!README.md'
      - '!wrangler.jsonc'
      - '!tsconfig.json'
      - '!.prettierrc'
      - '!.prettierignore'
      - .github/workflows/oss.yml
  workflow_dispatch:

concurrency:
  group: oss
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install rclone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/rclone"
          cd "$RUNNER_TEMP/rclone"
          gh release download --repo rclone/rclone --pattern '*-linux-amd64.zip' --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          unzip -jo rclone-*-linux-amd64.zip '*/rclone'
          echo "$RUNNER_TEMP/rclone" >> "$GITHUB_PATH"
          ./rclone version

      - name: Generate static content
        run: |
          pnpm install --prod
          pnpm run build

      - name: Deploy to OSS
        env:
          RCLONE_CONFIG_OSS_TYPE: s3
          RCLONE_CONFIG_OSS_PROVIDER: Alibaba
          RCLONE_CONFIG_OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESSID }}
          RCLONE_CONFIG_OSS_SECRET_ACCESS_KEY: ${{ secrets.OSS_ACCESSKEY }}
          RCLONE_CONFIG_OSS_ENDPOINT: oss-${{ secrets.OSS_REGION }}.aliyuncs.com
          RCLONE_CONFIG_OSS_NO_CHECK_BUCKET: 'true'
        run: |
          rclone sync public/ 'oss:${{ secrets.OSS_BUCKET }}' --checksum --fast-list --transfers 10 --exclude '/.dlsdata/**' -v
