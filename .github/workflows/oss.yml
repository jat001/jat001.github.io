name: Deploy static content to Alibaba Cloud OSS

on:
  push:
    branches:
      - master
    paths:
      - '**'
      - '!.github/**'
      - '!.vscode/**'
      - '!scaffolds/**'
      - '!source/_drafts/**'
      - '!worker/**'
      - '!.gitignore'
      - '!README.md'
      - '!wrangler.jsonc'
      - .github/workflows/oss.yml
  workflow_dispatch:

concurrency:
  group: oss
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install ossutil
        run: |
          version="$(curl -fsS https://gosspublic.alicdn.com/ossutil/v2/version.txt | awk '{print $NF}')"
          curl -fsSLo "$RUNNER_TEMP/ossutil.zip" "https://gosspublic.alicdn.com/ossutil/v2/${version}/ossutil-${version}-linux-amd64.zip"
          unzip -jo "$RUNNER_TEMP/ossutil.zip" '*/ossutil' -d "$RUNNER_TEMP/ossutil"
          echo "$RUNNER_TEMP/ossutil" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ossutil/ossutil" version

      - name: Generate static content
        run: |
          pnpm install
          pnpm run build

      - name: Deploy to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESSID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESSKEY }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
        run: |
          ossutil sync public/ 'oss://${{ secrets.OSS_BUCKET }}/' -f --delete --checksum --acl default -j 10 --no-progress
