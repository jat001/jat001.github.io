name: Deploy static content to Tencent Cloud COS

on:
  push:
    branches:
      - master
    paths:
      - '**'
      - '!.github/**'
      - '!.vscode/**'
      - '!scaffolds/**'
      - '!source/_drafts/**'
      - '!worker/**'
      - '!.gitignore'
      - '!README.md'
      - '!wrangler.jsonc'
      - .github/workflows/cos.yml
  workflow_dispatch:

concurrency:
  group: cos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install rclone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/rclone"
          cd "$RUNNER_TEMP/rclone"
          gh release download --repo rclone/rclone --pattern '*-linux-amd64.zip' --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          unzip -jo rclone-*-linux-amd64.zip '*/rclone'
          echo "$RUNNER_TEMP/rclone" >> "$GITHUB_PATH"
          ./rclone version

      - name: Generate static content
        run: |
          pnpm install
          pnpm run build

      - name: Deploy to COS
        env:
          RCLONE_CONFIG_COS_TYPE: s3
          RCLONE_CONFIG_COS_PROVIDER: TencentCOS
          RCLONE_CONFIG_COS_ACCESS_KEY_ID: ${{ secrets.COS_SECRETID }}
          RCLONE_CONFIG_COS_SECRET_ACCESS_KEY: ${{ secrets.COS_SECRETKEY }}
          RCLONE_CONFIG_COS_ENDPOINT: cos.${{ secrets.COS_REGION }}.myqcloud.com
          RCLONE_CONFIG_COS_NO_CHECK_BUCKET: 'true'
        run: |
          rclone sync public/ 'cos:${{ secrets.COS_BUCKET }}' --checksum --fast-list --transfers 10 -v
