[dev]
framework = "#custom"
command = "pnpm run server"
targetPort = 4000
autoLaunch = false

[build]
ignore = "bash bin/ignore-build.sh"
command = "pnpm run build"
publish = "public"

[build.processing.html]
pretty_urls = true

[[redirects]]
from = "/index.html"
to = "/"
status = 301
force = true

[[redirects]]
from = "/404"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/404.html"
to = "/404.html"
status = 404
force = true
